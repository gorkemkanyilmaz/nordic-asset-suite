name: NordicAssetSuite
options:
  bundleIdPrefix: com.nordicassetsuite
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AssetCore:
    path: ./AssetCore

targets:
  ApplianceWarrantyManager:
    type: application
    platform: iOS
    sources:
      - ApplianceWarrantyManager
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.appliance
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_KEY_CFBundleDisplayName: "Appliance Warranty Manager"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_GEMINI_API_KEY: "$(GEMINI_API_KEY)"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan appliance receipts, warranty cards, and error code badges."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select appliance receipts, warranty invoices, and rating plate photos from your photo library."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save appliance warranty certificates and diagnostic export reports to your photo library."

  SkiGearTracker:
    type: application
    platform: iOS
    sources:
      - SkiGearTracker
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.skigear
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_KEY_CFBundleDisplayName: "Ski & Snowboard Gear Tuning"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_GEMINI_API_KEY: "$(GEMINI_API_KEY)"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan ski bindings, boot sole lengths, and purchase receipts."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select ski equipment receipts, boot sole photos, and binding certificates from your photo library."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save ski tuning profiles and DIN calculation reports to your photo library."

  EBikeServiceTracker:
    type: application
    platform: iOS
    sources:
      - EBikeServiceTracker
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.ebike
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_KEY_CFBundleDisplayName: "E-Bike Service & Maintenance"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_GEMINI_API_KEY: "$(GEMINI_API_KEY)"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan frame serial numbers, motor badges, and maintenance invoices."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select e-bike purchase receipts, service invoices, and component serial photos from your photo library."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save e-bike telemetry health logs and maintenance certificates to your photo library."

  CoffeeMachineCompanion:
    type: application
    platform: iOS
    sources:
      - CoffeeMachineCompanion
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.coffee
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_KEY_CFBundleDisplayName: "Coffee Brew & Espresso Log"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_GEMINI_API_KEY: "$(GEMINI_API_KEY)"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan espresso machine rating badges and water hardness test strips."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select coffee machine receipts, rating badges, and brew setup photos from your photo library."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save espresso brew journals and descaling certificates to your photo library."

schemes:
  ApplianceWarrantyManager:
    build:
      targets:
        ApplianceWarrantyManager: all
    archive:
      config: Release
  SkiGearTracker:
    build:
      targets:
        SkiGearTracker: all
    archive:
      config: Release
  EBikeServiceTracker:
    build:
      targets:
        EBikeServiceTracker: all
    archive:
      config: Release
  CoffeeMachineCompanion:
    build:
      targets:
        CoffeeMachineCompanion: all
    archive:
      config: Release
