name: NordicAssetSuite
options:
  bundleIdPrefix: com.nordicassetsuite
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  AssetCore:
    path: ./AssetCore

targets:
  ApplianceWarrantyManager:
    type: application
    platform: iOS
    sources:
      - ApplianceWarrantyManager
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.appliance
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Appliance Warranty"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Scan appliance receipts, warranty cards, and error code badges."

  SkiGearTracker:
    type: application
    platform: iOS
    sources:
      - SkiGearTracker
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.skigear
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Ski Gear Tracker"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Scan ski bindings, boot sole lengths, and purchase receipts."

  EBikeServiceTracker:
    type: application
    platform: iOS
    sources:
      - EBikeServiceTracker
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.ebike
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "E-Bike Service"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Scan frame serial numbers, motor badges, and maintenance invoices."

  CoffeeMachineCompanion:
    type: application
    platform: iOS
    sources:
      - CoffeeMachineCompanion
    dependencies:
      - package: AssetCore
        product: AssetCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nordicassetsuite.coffee
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Coffee Companion"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Scan espresso machine rating badges and water hardness test strips."
