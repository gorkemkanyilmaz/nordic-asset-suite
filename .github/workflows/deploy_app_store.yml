name: Deploy Nordic Asset Suite — TestFlight + App Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit to App Store Review after metadata upload'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    name: Swift 6 Audit & Unit Tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting highest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Run Concurrency Audit & Tests
        run: |
          chmod +x BuildScripts/*.sh
          ./BuildScripts/verify_concurrency.sh
          ./BuildScripts/run_all_tests.sh

  deploy_testflight:
    name: Archive, Sign & Upload to TestFlight
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting highest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "✅ Project generated. Available schemes:"
          xcodebuild -project NordicAssetSuite.xcodeproj -list 2>/dev/null | head -20

      - name: Deploy All Apps via Fastlane (TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gem install fastlane --no-document
          fastlane deploy_all

  deliver_app_store:
    name: Upload Metadata & Submit for App Review
    needs: deploy_testflight
    if: github.event.inputs.submit_for_review == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Upload Metadata & Submit for Review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane deliver_all
