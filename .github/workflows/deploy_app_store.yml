name: Deploy Nordic Asset Suite — TestFlight + App Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit to App Store Review after metadata upload'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    name: Swift 6 Audit & Unit Tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting highest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Run Concurrency Audit & Tests
        run: |
          set -o pipefail
          chmod +x BuildScripts/*.sh
          ./BuildScripts/verify_concurrency.sh 2>&1 | tee build_audit.log
          ./BuildScripts/run_all_tests.sh 2>&1 | tee -a build_audit.log

      - name: Surface build errors
        if: failure()
        run: |
          if [ -f build_audit.log ]; then
            grep -E "error:|failed|XCTAssert" build_audit.log | head -40 | while read -r line; do
              echo "::error::${line}"
            done
          fi

  deploy_testflight:
    name: Archive, Sign & Upload to TestFlight
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$GEMINI_API_KEY" ] && missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them in repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets present."

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting highest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log
          echo "✅ Project generated. Available schemes:"
          xcodebuild -project NordicAssetSuite.xcodeproj -list 2>&1 | tee -a xcodegen.log

      - name: Deploy All Apps via Fastlane (TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          set -x
          which fastlane || gem install fastlane --no-document
          fastlane --version
          set +x
          fastlane deploy_all 2>&1 | tee fastlane.log
          echo "=== Verifying IPA artifacts ==="
          ls -la build/ipa/ || true
          test -s build/ipa/ApplianceWarrantyManager.ipa
          test -s build/ipa/SkiGearTracker.ipa
          test -s build/ipa/EBikeServiceTracker.ipa
          test -s build/ipa/CoffeeMachineCompanion.ipa
          echo "=== All 4 IPAs verified ==="

      - name: Surface deploy errors
        if: failure()
        run: |
          if [ -f fastlane.log ]; then
            grep -aE "Missing|user_error|error|Error|ERROR|failed|Failed|fatal|❌|invalid" fastlane.log | grep -avE "^\s*$" | tail -10 | while read -r line; do
              echo "::error::fastlane: ${line}"
            done
          fi
          if [ -f xcodegen.log ] && grep -aqE "error|failed" xcodegen.log; then
            grep -aE "error|failed" xcodegen.log | head -5 | while read -r line; do
              echo "::error::xcodegen: ${line}"
            done
          fi

      - name: Upload deploy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: |
            xcodegen.log
            fastlane.log
          if-no-files-found: ignore

  deliver_app_store:
    name: Upload Metadata & Submit for App Review
    needs: deploy_testflight
    if: github.event.inputs.submit_for_review == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Upload Metadata & Submit for Review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane deliver_all
