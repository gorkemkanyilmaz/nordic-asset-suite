name: Deploy Nordic Asset Suite to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Swift 6 Audit & Unit Tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting highest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Run Concurrency Audit & Tests
        run: |
          chmod +x BuildScripts/*.sh
          ./BuildScripts/verify_concurrency.sh
          ./BuildScripts/run_all_tests.sh

  deploy:
    name: Archive, Sign & Upload to TestFlight
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting highest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "✅ Project generated. Available schemes:"
          xcodebuild -project NordicAssetSuite.xcodeproj -list 2>/dev/null | head -20

      - name: Deploy All Apps via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install fastlane --no-document
          fastlane deploy_all
