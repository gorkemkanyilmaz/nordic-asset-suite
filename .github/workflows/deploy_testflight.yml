name: Deploy Nordic Asset Suite to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Swift 6 Audit & Unit Tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Run Tests
        run: |
          chmod +x BuildScripts/*.sh
          ./BuildScripts/verify_concurrency.sh
          ./BuildScripts/run_all_tests.sh

  deploy:
    name: Archive & Upload to TestFlight
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate
          echo "Available schemes:"
          xcodebuild -project NordicAssetSuite.xcodeproj -list

      - name: Deploy All Apps to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x BuildScripts/deploy_testflight.sh
          ./BuildScripts/deploy_testflight.sh
