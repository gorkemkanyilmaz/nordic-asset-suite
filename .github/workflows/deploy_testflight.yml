name: Deploy Nordic Asset Suite to TestFlight (Windows Cloud CI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Xcode Toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 3. Audit Swift 6 Concurrency & Run All Unit Tests
        run: |
          chmod +x BuildScripts/*.sh
          ./BuildScripts/verify_concurrency.sh
          ./BuildScripts/run_all_tests.sh

      - name: 4. Generate Native Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 5. Execute Fastlane Automated TestFlight Upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          fastlane deploy_all

      - name: 6. TestFlight Deployment Completed
        run: |
          echo "=========================================================="
          echo "    ALL 4 APPS DEPLOYED DIRECTLY TO APPLE TESTFLIGHT"
          echo "=========================================================="
