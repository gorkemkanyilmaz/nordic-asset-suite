name: Deploy Nordic Asset Suite to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Swift 6 Audit & Unit Tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Run Concurrency Audit & Tests
        run: |
          chmod +x BuildScripts/*.sh
          ./BuildScripts/verify_concurrency.sh
          ./BuildScripts/run_all_tests.sh

  deploy:
    name: Archive, Sign & Upload to TestFlight
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "✅ Project generated. Available schemes:"
          xcodebuild -project NordicAssetSuite.xcodeproj -list 2>/dev/null | head -20

      - name: Deploy All Apps via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install fastlane --no-document
          fastlane deploy_all
